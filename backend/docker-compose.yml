
services:
  mysql:
    image: mysql:8.4
    container_name: shopsphere-mysql
    restart: unless-stopped

    environment:
      MYSQL_DATABASE: shopsphere
      MYSQL_USER: shopsphere_user
      MYSQL_PASSWORD: shopsphere_password
      MYSQL_ROOT_PASSWORD: root_password

    ports:
      - "3306:3306"

    volumes:
      - shopsphere_mysql_data:/var/lib/mysql

    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  shopsphere_mysql_data:
