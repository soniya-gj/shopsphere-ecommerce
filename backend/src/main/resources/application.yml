
spring:
  application:
    name: shopsphere-backend

  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/shopsphere}
    username: ${DB_USERNAME:shopsphere_user}
    password: ${DB_PASSWORD:shopsphere_password}
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.MySQLDialect

server:
  port: 8080

management:
  endpoints:
    web:
      exposure:
        include: health,info

  endpoint:
    health:
      show-details: always

info:
  app:
    name: ShopSphere
    description: Full Stack E-Commerce Platform
    version: 0.0.1
